<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full ATS Resume Builder</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  body { background-color: #f8f9fa; }
  #resumePreview { border: 1px solid #ccc; padding: 20px; margin-top: 20px; background: #fff; }
  h2,h3,h4 { margin-top: 15px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container my-4">
  <h1 class="text-center mb-4">ATS Resume Builder</h1>

  <!-- Personal Info -->
  <div class="card mb-3 p-3">
    <h3>Personal Info</h3>
    <div class="row g-3">
      <div class="col-md-6"><input class="form-control" placeholder="Full Name" id="name"></div>
      <div class="col-md-6"><input class="form-control" placeholder="Email" id="email"></div>
      <div class="col-md-6"><input class="form-control" placeholder="Phone" id="phone"></div>
      <div class="col-md-6"><input class="form-control" placeholder="LinkedIn/GitHub URL" id="linkedin"></div>
    </div>
  </div>

  <!-- Summary -->
  <div class="card mb-3 p-3">
    <h3>Summary</h3>
    <textarea class="form-control" id="summary" rows="3" placeholder="Write a brief summary"></textarea>
  </div>

  <!-- Skills -->
  <div class="card mb-3 p-3">
    <h3>Skills</h3>
    <input class="form-control" id="skills" placeholder="Comma separated skills">
  </div>

  <!-- Experience -->
  <div class="card mb-3 p-3">
    <h3>Experience <button class="btn btn-sm btn-success" onclick="addExperience()">+ Add</button></h3>
    <div id="experienceContainer"></div>
  </div>

  <!-- Education -->
  <div class="card mb-3 p-3">
    <h3>Education <button class="btn btn-sm btn-success" onclick="addEducation()">+ Add</button></h3>
    <div id="educationContainer"></div>
  </div>

  <!-- Projects -->
  <div class="card mb-3 p-3">
    <h3>Projects <button class="btn btn-sm btn-success" onclick="addProject()">+ Add</button></h3>
    <div id="projectContainer"></div>
  </div>

  <!-- Achievements -->
  <div class="card mb-3 p-3">
    <h3>Achievements <button class="btn btn-sm btn-success" onclick="addAchievement()">+ Add</button></h3>
    <div id="achievementContainer"></div>
  </div>

  <!-- Colors -->
  <div class="card mb-3 p-3">
    <h3>Color Customization</h3>
    <div class="row g-3">
      <div class="col-md-4"><label>Header Color</label><input type="color" class="form-control form-control-color" id="headerColor"></div>
      <div class="col-md-4"><label>Section Title Color</label><input type="color" class="form-control form-control-color" id="sectionColor"></div>
      <div class="col-md-4"><label>Text Color</label><input type="color" class="form-control form-control-color" id="textColor"></div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="text-center mb-3">
    <button class="btn btn-primary me-2" onclick="generateResume()">Preview Resume</button>
    <button class="btn btn-success me-2" onclick="downloadPDF()">Download PDF</button>
    <button class="btn btn-secondary" onclick="saveResume()">Save Resume</button>
  </div>

  <!-- Resume Preview -->
  <div id="resumePreview"></div>
</div>

<script>
let experienceCount=0, educationCount=0, projectCount=0, achievementCount=0;

// Add dynamic entries
function addExperience() {
  experienceCount++;
  const container = document.getElementById('experienceContainer');
  container.insertAdjacentHTML('beforeend', `<div class="mb-2 border p-2">
    <input class="form-control mb-1" placeholder="Job Title" id="expTitle${experienceCount}">
    <input class="form-control mb-1" placeholder="Company" id="expCompany${experienceCount}">
    <input class="form-control mb-1" placeholder="Start - End Dates" id="expDates${experienceCount}">
    <textarea class="form-control mb-1" placeholder="Description" id="expDesc${experienceCount}" rows="2"></textarea>
  </div>`);
}

function addEducation() {
  educationCount++;
  const container = document.getElementById('educationContainer');
  container.insertAdjacentHTML('beforeend', `<div class="mb-2 border p-2">
    <input class="form-control mb-1" placeholder="Degree" id="eduDegree${educationCount}">
    <input class="form-control mb-1" placeholder="Institution" id="eduInst${educationCount}">
    <input class="form-control mb-1" placeholder="Start - End Dates" id="eduDates${educationCount}">
    <textarea class="form-control mb-1" placeholder="Description" id="eduDesc${educationCount}" rows="2"></textarea>
  </div>`);
}

function addProject() {
  projectCount++;
  const container = document.getElementById('projectContainer');
  container.insertAdjacentHTML('beforeend', `<div class="mb-2 border p-2">
    <input class="form-control mb-1" placeholder="Project Title" id="projTitle${projectCount}">
    <textarea class="form-control mb-1" placeholder="Description" id="projDesc${projectCount}" rows="2"></textarea>
    <input class="form-control mb-1" placeholder="Link" id="projLink${projectCount}">
  </div>`);
}

function addAchievement() {
  achievementCount++;
  const container = document.getElementById('achievementContainer');
  container.insertAdjacentHTML('beforeend', `<div class="mb-2 border p-2">
    <input class="form-control mb-1" placeholder="Achievement/Certificate" id="achTitle${achievementCount}">
  </div>`);
}

// Generate Resume
function generateResume() {
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const phone = document.getElementById('phone').value;
  const linkedin = document.getElementById('linkedin').value;
  const summary = document.getElementById('summary').value;
  const skills = document.getElementById('skills').value.split(',').map(s=>s.trim()).join(', ');

  const headerColor = document.getElementById('headerColor').value;
  const sectionColor = document.getElementById('sectionColor').value;
  const textColor = document.getElementById('textColor').value;

  let expHTML='', eduHTML='', projHTML='', achHTML='';

  for(let i=1;i<=experienceCount;i++){
    const title=document.getElementById(`expTitle${i}`)?.value;
    if(title){
      const company=document.getElementById(`expCompany${i}`).value;
      const dates=document.getElementById(`expDates${i}`).value;
      const desc=document.getElementById(`expDesc${i}`).value.replace(/\n/g,'<br>');
      expHTML+=`<p><strong>${title}</strong>, ${company} (${dates})<br>${desc}</p>`;
    }
  }

  for(let i=1;i<=educationCount;i++){
    const degree=document.getElementById(`eduDegree${i}`)?.value;
    if(degree){
      const inst=document.getElementById(`eduInst${i}`).value;
      const dates=document.getElementById(`eduDates${i}`).value;
      const desc=document.getElementById(`eduDesc${i}`).value.replace(/\n/g,'<br>');
      eduHTML+=`<p><strong>${degree}</strong>, ${inst} (${dates})<br>${desc}</p>`;
    }
  }

  for(let i=1;i<=projectCount;i++){
    const title=document.getElementById(`projTitle${i}`)?.value;
    if(title){
      const desc=document.getElementById(`projDesc${i}`).value.replace(/\n/g,'<br>');
      const link=document.getElementById(`projLink${i}`).value;
      projHTML+=`<p><strong>${title}</strong>${link ? ', <a href="'+link+'" target="_blank">'+link+'</a>' : ''}<br>${desc}</p>`;
    }
  }

  for(let i=1;i<=achievementCount;i++){
    const title=document.getElementById(`achTitle${i}`)?.value;
    if(title){
      achHTML+=`<p>${title}</p>`;
    }
  }

  const resumeHTML=`
    <div style="color:${textColor}; font-family:Arial, sans-serif;">
      <h2 style="color:${headerColor}">${name}</h2>
      <p>${email} | ${phone} | ${linkedin}</p>
      <h3 style="color:${sectionColor}">Summary</h3><p>${summary}</p>
      <h3 style="color:${sectionColor}">Skills</h3><p>${skills}</p>
      ${expHTML ? '<h3 style="color:'+sectionColor+'">Experience</h3>'+expHTML : ''}
      ${eduHTML ? '<h3 style="color:'+sectionColor+'">Education</h3>'+eduHTML : ''}
      ${projHTML ? '<h3 style="color:'+sectionColor+'">Projects</h3>'+projHTML : ''}
      ${achHTML ? '<h3 style="color:'+sectionColor+'">Achievements</h3>'+achHTML : ''}
    </div>
  `;

  document.getElementById('resumePreview').innerHTML=resumeHTML;
}

// Download PDF
function downloadPDF() {
  const element = document.getElementById('resumePreview');
  html2pdf().from(element).set({
    margin:0.5,
    filename:'Resume.pdf',
    html2canvas:{scale:2},
    jsPDF:{unit:'in',format:'letter',orientation:'portrait'}
  }).save();
}

// Save Resume to localStorage
function saveResume() {
  const resumeData = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    linkedin: document.getElementById('linkedin').value,
    summary: document.getElementById('summary').value,
    skills: document.getElementById('skills').value,
    headerColor: document.getElementById('headerColor').value,
    sectionColor: document.getElementById('sectionColor').value,
    textColor: document.getElementById('textColor').value,
    experienceCount,
    educationCount,
    projectCount,
    achievementCount
  };
  localStorage.setItem('resumeData', JSON.stringify(resumeData));
  alert('Resume saved! (Reload to continue editing)');
}

// Load saved resume if exists
window.onload = function() {
  const saved = JSON.parse(localStorage.getItem('resumeData'));
  if(saved){
    document.getElementById('name').value=saved.name||'';
    document.getElementById('email').value=saved.email||'';
    document.getElementById('phone').value=saved.phone||'';
    document.getElementById('linkedin').value=saved.linkedin||'';
    document.getElementById('summary').value=saved.summary||'';
    document.getElementById('skills').value=saved.skills||'';
    document.getElementById('headerColor').value=saved.headerColor||'#000000';
    document.getElementById('sectionColor').value=saved.sectionColor||'#000000';
    document.getElementById('textColor').value=saved.textColor||'#000000';
    experienceCount=saved.experienceCount||0;
    educationCount=saved.educationCount||0;
    projectCount=saved.projectCount||0;
    achievementCount=saved.achievementCount||0;
  }
}
</script>
</body>
</html>
