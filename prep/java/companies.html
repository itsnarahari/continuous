<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Wise Q&A</title>

    <!-- Bootstrap & Prism.js for Syntax Highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

    <style>
        body {
            background-color: #121212;
            color: white;
        }

        .container {
            max-width: 900px;
            margin-top: 20px;
        }

        .accordion-button {
            background-color: #343a40;
            color: white;
        }

        .accordion-button:focus {
            box-shadow: none;
        }

        .accordion-button:not(.collapsed) {
            background-color: #007bff;
            color: white;
        }

        .accordion-body {
            background-color: #1e1e1e;
            color: white;
        }

        .highlight-yellow {
            color: #ffcc00;
            /* Yellow */
            font-weight: bold;
        }

        .highlight-blue {
            color: #4db8ff;
            /* Light blue */
            font-weight: bold;
        }

        pre[class*="language-"] {
            background: #1e1e1e !important;
            border-radius: 8px;
            padding: 12px;
        }

        /* Search Box Styling */
        .search-container {
            margin-bottom: 15px;
            text-align: center;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #666;
            background: #222;
            color: white;
            outline: none;
            font-size: 16px;
        }

        .search-input::placeholder {
            color: #aaa;
        }
    </style>
</head>

<body class="bg-dark text-light">
    <div class="container">
        <div class="header fw-bold text-center mb-4">Company Wise Q&A</div>
        <div class="text-center mb-4">
            <div class="row justify-content-center g-2">
                <div class="col-auto">
                    <button class="btn btn-primary" onclick="location.href='companies/paypal.html'">Paypal</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary" onclick="location.href='companies/jpmc.html'">JPMC</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary" onclick="location.href='companies/walmart.html'">Walmart</button>
                </div>

                                <div class="col-auto">
                    <button class="btn btn-primary" onclick="location.href='general/mixOf.html'">Mix Of</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap & Search Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function searchQuestions() {
            let input = document.getElementById("searchBox").value.toLowerCase();
            let items = document.querySelectorAll(".search-item");

            items.forEach((item) => {
                let text = item.textContent.toLowerCase();
                let parent = item.closest(".accordion-item");

                if (text.includes(input)) {
                    parent.style.display = "";
                } else {
                    parent.style.display = "none";
                }
            });
        }
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Copied: " + text);
            }).catch(err => {
                console.error("Failed to copy:", err);
            });
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let items = document.querySelectorAll(".accordion-item");

            items.forEach((item, index) => {
                let button = item.querySelector(".accordion-button");
                if (button) {
                    button.innerHTML = `<span class="fw-bold me-2">${index + 1}.</span> ` + button.innerHTML;
                }
            });
        });
    </script>
</body>

</html>
