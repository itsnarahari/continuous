`class BoundedQueue<T>{
  final ReentrantLock lock=new ReentrantLock();
  final Condition notFull=lock.newCondition(), notEmpty=lock.newCondition();
  final Object[] buf; int head=0, tail=0, size=0;
  BoundedQueue(int n){ buf=new Object[n]; }
  void put(T x) throws InterruptedException{
    lock.lock();
    try{
      while(size==buf.length) notFull.await();
      buf[tail]=(Object)x; tail=(tail+1)%buf.length; size++;
      notEmpty.signal();
    } finally { lock.unlock(); }
  }
  T take() throws InterruptedException{
    lock.lock();
    try{
      while(size==0) notEmpty.await();
      @SuppressWarnings("unchecked") T x=(T)buf[head];
      head=(head+1)%buf.length; size--; notFull.signal(); return x;
    } finally { lock.unlock(); }
  }
}`

      "Event sourcing + snapshots—operational concerns?",
      [
        "Snapshot after N events or time; reduce replay time.",
        "Immutable event log; migrations via upcasters.",
        "Projections are rebuildable; store projection version.",
        "Backfill tools and idempotent handlers are essential."
      ]
    ),
    qa("Design Patterns","Hard",
      "Anti-corruption layer (ACL) to strangle a monolith?",
      [
        "ACL translates models/protocols; isolates domain from legacy quirks.",
        "Start with reads, then writes; route gradually.",
        "Contract tests between ACL and legacy.",
        "Measure dependency reduction over time."
      ]
    ),
    // Tricky
    qa("Design Patterns","Tricky",
      "Double-checked locking singleton—what’s the safe way?",
      [
        "Use volatile instance to prevent reordering.",
        "Or use Initialization-on-Demand Holder idiom (best).",
        "Avoid lazy init if not needed; keep simple.",
        "Prefer enum singleton for simplicity."
      ],
`public class S {
  private static volatile S i;
  public static S get(){
    if(i==null){ synchronized(S.class){ if(i==null) i=new S(); } }
    return i;
  }
}`
    )
  ]
};

/* ===== Render ===== */
const techOrder = ["Java","Spring Boot","Hibernate/JPA","Microservices","Spring Cloud","Design Patterns"];
const techAccordion = document.getElementById("techAccordion");

let gid = 0;
for (const topic of techOrder) {
  const groupId = `g${gid++}`;
  techAccordion.innerHTML += `
    <div class="accordion-item bg-dark text-light">
      <h2 class="accordion-header" id="${groupId}-h">
        <button class="accordion-button collapsed search-item" type="button" data-bs-toggle="collapse" data-bs-target="#${groupId}">
          ${topic} ${badge(topic)}
        </button>
      </h2>
      <div id="${groupId}" class="accordion-collapse collapse">
        <div class="accordion-body">
          <div id="${groupId}-content"></div>
        </div>
      </div>
    </div>`;
  const body = document.getElementById(`${groupId}-content`);

  const items = data[topic];
  const cats = ["Easy","Medium","Hard","Tricky"];
  for (const cat of cats) {
    const subset = items.filter(x => x.diff===cat);
    if (!subset.length) continue;
    const subId = `${groupId}-${cat}`;
    body.innerHTML += `
      <div class="mb-3">
        <h5 class="${catColor[cat]}">${cat} <span class="badge bg-dark border">${subset.length}</span></h5>
        <div class="accordion" id="${subId}"></div>
      </div>`;
    const subAcc = document.getElementById(subId);
    subset.forEach((item, idx) => {
      const qid = `${subId}-q${idx}`;
      subAcc.innerHTML += `
        <div class="accordion-item bg-dark border rounded">
          <h2 class="accordion-header" id="${qid}-h">
            <button class="accordion-button collapsed search-item" type="button" data-bs-toggle="collapse" data-bs-target="#${qid}">
              ${idx+1}) ${item.q} ${badge(item.topic)}
            </button>
          </h2>
          <div id="${qid}" class="accordion-collapse collapse">
            <div class="accordion-body">
              <ul class="mb-2">${item.a.map(s=>`<li>${s}</li>`).join("")}</ul>
              ${item.code ? `<pre class="mb-0"><code class="language-java">${item.code.replaceAll("<","&lt;").replaceAll(">","&gt;")}</code></pre>` : ""}
            </div>
          </div>
        </div>`;
    });
  }
}
</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Simple search: show/hide each accordion item based on its text
    function searchQuestions() {
      const q = document.getElementById("searchBox").value.toLowerCase().trim();
      const items = document.querySelectorAll("#walmartAccordion .accordion-item");
      items.forEach((item) => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(q) ? "" : "none";
      });
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("Copied: " + text);
      }).catch(err => {
        console.error("Failed to copy:", err);
      });
    }

    // Add numbering to accordion buttons
    document.addEventListener("DOMContentLoaded", function () {
      const items = document.querySelectorAll("#walmartAccordion .accordion-item");
      items.forEach((item, index) => {
        const button = item.querySelector(".accordion-button");
        if (button && !button.dataset.numbered) {
          button.dataset.numbered = "true";
          button.innerHTML = `<span class="fw-bold me-2">${index + 1}.</span> ` + button.innerHTML;
        }
      });
    });
  </script>
