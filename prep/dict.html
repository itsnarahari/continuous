<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📘 Personal Dictionary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background-color: #121212;
    color: #f1f1f1;
  }

  .form-control, .btn {
    background-color: #1e1e1e;
    color: #f1f1f1;
    border: 1px solid #333;
  }

  .btn:hover {
    background-color: #333;
  }

  .table {
    color: #f1f1f1;
  }

  /* 🔧 FIX placeholder text color */
  ::placeholder {
    color: #bbb !important;
    opacity: 1;
  }

  input:-ms-input-placeholder {
    color: #bbb !important;
  }

  input::-ms-input-placeholder {
    color: #bbb !important;
  }
</style>

</head>
<body class="p-4">

  <div class="container">
    <h2 class="mb-4 text-info">📘 Personal English-Telugu Dictionary</h2>

    <!-- Form -->
    <div class="row g-2 mb-4">
      <div class="col-md-5">
        <input type="text" id="english" class="form-control" placeholder="Enter English word">
      </div>
      <div class="col-md-5">
        <input type="text" id="telugu" class="form-control" placeholder="Enter Telugu meaning">
      </div>
      <div class="col-md-2">
        <button onclick="addWord()" class="btn btn-success w-100">➕ Add</button>
      </div>
    </div>

    <!-- Search -->
    <div class="mb-3">
      <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search for English word..." onkeyup="searchTable()">
    </div>

    <!-- Dictionary Table -->
    <table class="table table-striped table-dark table-hover">
      <thead>
        <tr>
          <th>English</th>
          <th>Telugu</th>
        </tr>
      </thead>
      <tbody id="dictionaryBody">
        <!-- Loaded content -->
      </tbody>
    </table>
  </div>

  <script>
    const SHEETDB_URL = "https://sheetdb.io/api/v1/18icoraabkj7c";

    // Load entries on page load
    window.onload = function() {
      fetch(SHEETDB_URL)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('dictionaryBody');
          data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${row.english}</td><td>${row.telugu}</td>`;
            tbody.appendChild(tr);
          });
        });
    };

    // Add new word
    function addWord() {
      const english = document.getElementById("english").value.trim();
      const telugu = document.getElementById("telugu").value.trim();

      if (!english || !telugu) {
        alert("Both fields are required!");
        return;
      }

      fetch(SHEETDB_URL, {
        method: "POST",
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ data: { english, telugu } })
      })
      .then(response => response.json())
      .then(data => {
        // Add to UI
        const tbody = document.getElementById('dictionaryBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${english}</td><td>${telugu}</td>`;
        tbody.appendChild(tr);

        // Clear input
        document.getElementById("english").value = "";
        document.getElementById("telugu").value = "";
      });
    }

    // Search logic
    function searchTable() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#dictionaryBody tr");

      rows.forEach(row => {
        const englishCell = row.children[0].textContent.toLowerCase();
        if (englishCell.includes(input)) {
          row.style.display = "";
        } else {
          row.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
